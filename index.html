<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitap Takip Sistemi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6c63ff">
</head>

<body>

    <h1>📚 Kitap Takip Sistemim</h1>

    <p>Kitaplarını ekle ve okuma yolculuğunu takip et!</p>

    <div class="kitap-formu">

        <input type="text" id="kitapAdi" placeholder="Kitap adı">

        <input type="text" id="yazar" placeholder="Yazar adı">

        <button onclick="kitapEkle()">Kitap Ekle</button>

    </div>
<div class="istatistikler">

    <div>
        <h3 id="toplamKitap">0</h3>
        <p>Toplam Kitap</p>
    </div>

    <div>
        <h3 id="okunanKitap">0</h3>
        <p>Okunan</p>
    </div>

    <div>
        <h3 id="okunmayanKitap">0</h3>
        <p>Okunacak</p>
    </div>

</div>
    <h2>Kitaplarım</h2>

    <ul id="kitapListesi"></ul>

    <script src="script.js"></script>
    <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js")
            .then(function() {
                console.log("Uygulama hazır!");
            })
            .catch(function(error) {
                console.log("Hata:", error);
            });
    });
}
</script>

</body>
</html>
